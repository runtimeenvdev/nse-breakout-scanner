name: NSE 3-in-1 Weekly Breakout Scanner

on:
  schedule:
    # 3:05 PM IST every Friday = 09:35 UTC (15:05 - 05:30)
    # Day-of-Week 5 = Friday
    - cron: '35 9 * * 5'

  workflow_dispatch:
    inputs:
      universe_mode:
        description: 'Stock Universe to Scan'
        required: true
        default: 'NIFTY500'
        type: choice
        options:
          - NIFTY500
          - ALL_NSE

jobs:
  run-breakout-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Execute Full Breakout Scan & Portfolio Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNIVERSE_MODE: ${{ github.event.inputs.universe_mode || 'NIFTY500' }}
        run: python nse_200wma_scanner.py full
