name: Daily Portfolio Stop-Loss Check

on:
  schedule:
    # 3:20 PM IST Monday to Thursday = 09:50 UTC (15:20 - 05:30)
    # Cron format: Minute Hour Day Month Day-of-Week (1-4 = Mon-Thu)
    - cron: '50 9 * * 1-4'

  workflow_dispatch:

jobs:
  check-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Portfolio Stop-Loss Check Only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nse_200wma_scanner.py portfolio_only
